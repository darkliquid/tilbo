name: CI

on:
  push:
    branches: [main]
    tags-ignore: ["v*"] # releases are handled by release.yml
  pull_request:

# Cancel in-progress runs when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ---------------------------------------------------------------------------
  # generate: verify that committed proto-generated code is up-to-date.
  # ---------------------------------------------------------------------------
  generate:
    name: Check generated code
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Go tools
        id: cache-go-tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: go-tools-${{ runner.os }}-protoc-gen-go-v1.36.11-vtproto-v0.6.0

      - name: Install protobuf plugins
        if: steps.cache-go-tools.outputs.cache-hit != 'true'
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install github.com/planetscale/vtprotobuf/cmd/protoc-gen-go-vtproto@v0.6.0

      - name: Regenerate proto code
        run: buf generate

      - name: Verify no uncommitted changes
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated code is out of date. Run 'buf generate' and commit the result."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # lint: golangci-lint + buf lint
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.3
          args: --timeout=30m

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: buf lint
        run: buf lint

  # ---------------------------------------------------------------------------
  # vuln: vulnerability scanning with govulncheck
  # ---------------------------------------------------------------------------
  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Go tools
        id: cache-go-tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: go-tools-${{ runner.os }}-govulncheck-v1.1.4

      - name: Install govulncheck
        if: steps.cache-go-tools.outputs.cache-hit != 'true'
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run govulncheck
        run: govulncheck ./...

  # ---------------------------------------------------------------------------
  # test: unit tests with race detector + coverage + step summary
  # ---------------------------------------------------------------------------
  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Go tools
        id: cache-go-tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: go-tools-${{ runner.os }}-gotestsum-v1.13.0

      - name: Install gotestsum
        if: steps.cache-go-tools.outputs.cache-hit != 'true'
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Run tests
        run: |
          mkdir -p test-results
          gotestsum \
            --format=github-actions \
            --junitfile=test-results/junit.xml \
            -- \
            -count=1 \
            -timeout=45m \
            -race \
            -coverprofile=coverage.out \
            ./internal/... ./cmd/tilbo/...

      - name: Write coverage summary
        if: always()
        run: |
          echo "## Test Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: test-results/junit.xml
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

      - name: Report test results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Unit test results
          path: test-results/junit.xml
          reporter: java-junit
          fail-on-error: true

  # ---------------------------------------------------------------------------
  # bench: benchmarks captured and written to step summary
  # ---------------------------------------------------------------------------
  bench:
    name: Benchmarks
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run benchmarks
        run: |
          go test \
            -bench=. \
            -benchmem \
            -run=^$ \
            -count=5 \
            ./internal/graph/... \
            | tee bench-results.txt

      - name: Write benchmark summary
        run: |
          echo "## Benchmark Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat bench-results.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: bench-results.txt
          retention-days: 30

  # ---------------------------------------------------------------------------
  # build: cross-compile daemon + CLI without CGo for all release targets
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        goarch: [amd64, arm64]
    env:
      CGO_ENABLED: "0"
      GOOS: linux
      GOARCH: ${{ matrix.goarch }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build tilbo
        run: go build -v -trimpath -o tilbo ./cmd/tilbo

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: binaries-linux-${{ matrix.goarch }}
          path: |
            tilbo
          retention-days: 7
