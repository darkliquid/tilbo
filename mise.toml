[tools]
go = "latest"
buf = "latest"
golangci-lint = "2.11.3"
"go:google.golang.org/protobuf/cmd/protoc-gen-go" = "latest"
"go:github.com/planetscale/vtprotobuf/cmd/protoc-gen-go-vtproto" = "latest"
sqlc = "latest"
node = "25"
"npm:esbuild" = "latest"
"npm:protobufjs-cli" = "latest"

[tasks.build-daemon]
description = "Build tilbo binary"
run = "go build -v -o tilbo ./cmd/tilbo"
depends = ["generate"]

[tasks.generate-js]
description = "Generate JS bindings from protobuf for QML"
run = """
mkdir -p internal/ipc/gen
pbjs -t static-module -w es6 -o internal/ipc/gen/ipc_generated.js proto/tilbo/ipc/v1/ipc.proto
pbts -o internal/ipc/gen/ipc_generated.d.ts internal/ipc/gen/ipc_generated.js
esbuild internal/ipc/gen/ipc_generated.js --bundle --format=esm --outfile=cmd/tilbo-quickshell/services/qml_ipc.mjs
"""
sources = ["proto/**/*.proto"]
outputs = ["cmd/tilbo-quickshell/services/qml_ipc.mjs"]

[tasks.build-cli]
description = "Build tilbo binary"
run = "go build -v -o tilbo ./cmd/tilbo"
depends = ["generate"]
sources = ["**/*.go"]
outputs = ["tilbo"]

[tasks.build]
description = "Build the tilbo binary"
depends = ["build-daemon", "build-cli"]

[tasks.test]
description = "Run tests"
run = "go test -v ./..."
sources = ["**/*.go"]

[tasks.integration-test]
description = "Run integration tests"
run = "go test -v ./..."
dir = "{{config_root}}/test/integration"
sources = ["**/*.go"]

[tasks.local-integration-test]
description = "Run integration tests locally using Colima Docker context"
run = """
DOCKER_HOST=unix://$HOME/.config/colima/default/docker.sock \
TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE=$HOME/.config/colima/default/docker.sock \
TESTCONTAINERS_RYUK_DISABLED=true \
TILBO_TEST_TMPDIR=$HOME/tmp/tilbo-test \
TILBO_TEST_WATCHER=${TILBO_TEST_WATCHER:-inotify} \
go test -v -count=1 -timeout=15m ./...
"""
dir = "{{config_root}}/test/integration"
sources = ["**/*.go"]

[tasks.lint]
description = "Lint the Go codebase"
run = """
golangci-lint run ./...
buf lint
"""
sources = ["**/*.go"]

[tasks.format]
description = "Format the Go codebase"
run = "golangci-lint fmt ./..."
sources = ["**/*.go"]

[tasks.fixup]
description = "Format the Go codebase"
run = """
go fix ./...
golangci-lint run --fix ./... 2>/dev/null
"""
sources = ["**/*.go"]


[tasks.generate-proto]
description = "Generate protobuf code using buf and vtprotobuf"
run = "buf generate"
sources = ["proto/**/*.proto", "buf.*"]

[tasks.generate-sqlc]
description = "Generate sqlc code using sqlc"
run = "sqlc generate"
sources = ["query.sql"]
dir = "{{config_root}}/internal/index"

[tasks.generate]
description = "Generate protobuf and sqlc code"
depends = ["generate-proto", "generate-sqlc"]

[tasks.ci]
description = "Run the full CI pipeline (generate, lint, test, build)"
depends = ["generate", "lint", "test", "build"]

[tasks.clean]
description = "Clean build artifacts and generated code"
run = """
rm -rf tilbo tilbo-cli tilbo-daemon
rm -rf internal/ipc/gen/
"""

[tasks.run-quickshell]
description = "Run the tilbo Quickshell frontend (daemon must be running first)"
run = """
export QS_ICON_THEME="${QS_ICON_THEME:-$(contrib/scripts/detect-icon-theme.sh)}"
exec quickshell -p cmd/tilbo-quickshell/shell.qml
"""
sources = ["cmd/tilbo-quickshell/**/*.qml"]

[tasks.build-sqlite-vec]
description = "Rebuild sqlite-vec.wasm for the index package using pinned sqlite-vec-go versions"
run = "bash contrib/scripts/build-sqlite-vec.sh"
