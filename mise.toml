[tools]
go = "latest"
buf = "latest"
golangci-lint = "latest"
"go:google.golang.org/protobuf/cmd/protoc-gen-go" = "latest"
"go:github.com/planetscale/vtprotobuf/cmd/protoc-gen-go-vtproto" = "latest"
sqlc = "latest"

[tasks.build-daemon]
description = "Build tilbo daemon"
run = "go build -v ./cmd/tilbo-daemon"
depends = ["generate"]
sources = ["**/*.go"]
outputs = ["tilbo-daemon"]

[tasks.build-cli]
description = "Build tilbo cli"
run = "go build -v ./cmd/tilbo-cli"
depends = ["generate"]
sources = ["**/*.go"]
outputs = ["tilbo-cli"]

[tasks.build-browser]
description = "Build tilbo browser"
depends = ["generate"]
run = "go build -v ./cmd/tilbo-browser"
sources = ["**/*.go"]
outputs = ["tilbo-browser"]

[tasks.build]
description = "Build all tilbo binaries"
depends = ["build-daemon", "build-cli", "build-browser"]

[tasks.test]
description = "Run tests"
run = "go test -v ./..."
sources = ["**/*.go"]

[tasks.integration-test]
description = "Run integration tests"
run = "go test -v ./..."
dir = "{{config_root}}/test/integration"
sources = ["**/*.go"]

[tasks.lint]
description = "Lint the Go codebase"
run = "golangci-lint run ./..."
sources = ["**/*.go"]

[tasks.generate-proto]
description = "Generate protobuf code using buf and vtprotobuf"
run = "buf generate"
sources = ["proto/**/*.proto", "buf.*"]

[tasks.generate-sqlc]
description = "Generate sqlc code using sqlc"
run = "sqlc generate"
sources = ["query.sql"]
dir = "{{config_root}}/internal/index"

[tasks.generate]
description = "Generate protobuf and sqlc code"
depends = ["generate-proto", "generate-sqlc"]

[tasks.ci]
description = "Run the full CI pipeline (generate, lint, test, build)"
depends = ["generate", "lint", "test", "build"]

[tasks.clean]
description = "Clean build artifacts and generated code"
run = """
rm -rf tilbo-cli tilbo-daemon
rm -rf internal/ipc/gen/
"""

[tasks.build-sqlite-vec]
description = "Rebuild sqlite-vec.wasm for the index package"
run = """
#!/usr/bin/env bash
set -euo pipefail
WORK_DIR=$(mktemp -d)
trap 'rm -rf "$WORK_DIR"' EXIT
git clone https://github.com/ncruces/sqlite-vec-go "$WORK_DIR"
cd "$WORK_DIR"
./build.sh
cp sqlite-vec.wasm "{{config_root}}/internal/index/sqlite-vec.wasm"
echo "Successfully rebuilt and copied sqlite-vec.wasm to internal/index/"
"""
