name: Daemon CLI
type: module
description: "Cobra command setup, CLI flag parsing, config loading, signal handling, and logging configuration"

aspects:
  - aspect: structured-logging
    anchors:
      - setupLogging
      - slog.WarnContext
  - aspect: graceful-shutdown
    anchors:
      - signal.NotifyContext
      - syscall.SIGTERM
      - syscall.SIGHUP

relations:
  - target: daemon
    type: calls
    consumes: [run]

mapping:
  paths:
    - cmd/tilbo/cmd_daemon.go
