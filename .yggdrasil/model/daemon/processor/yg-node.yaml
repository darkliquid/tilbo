name: File Processor
type: module
description: "M2 pipeline: harvests metadata, evaluates rules, updates xattr and index for a single file"

aspects:
  - aspect: structured-logging
    anchors:
      - slog.DebugContext

relations:
  - target: daemon
    type: calls
    consumes: [ProcessFile, clearPathNonRetryable, clearNonRetryable]

mapping:
  paths:
    - internal/daemon/processor.go
