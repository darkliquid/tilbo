version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/darkliquid/tilbo/internal/ipc/gen
plugins:
  - local: protoc-gen-go
    out: internal/ipc/gen
    opt:
      - paths=source_relative
  - local: protoc-gen-go-vtproto
    out: internal/ipc/gen
    opt:
      - paths=source_relative
      - features=marshal+unmarshal+size
